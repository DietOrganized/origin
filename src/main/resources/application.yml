server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: calorie-app
  # 本地私有配置（数据库密码、API Key），该文件已在 .gitignore 中排除
  config:
    import: optional:classpath:application-secret.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/calorie_app?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: CalorieHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    view:
      # JSP 视图目录：/WEB-INF/jsp/xxx.jsp
      prefix: /WEB-INF/jsp/
      suffix: .jsp

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

jwt:
  # 生产环境请用环境变量覆盖，长度至少 32 字节
  secret: ${JWT_SECRET:calorie-app-jwt-secret-key-2026-please-change-in-production}
  expire-days: 30

deepseek:
  base-url: https://api.deepseek.com
  # Key 放在 application-secret.yml 或环境变量中，不写进代码仓库
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-chat
  connect-timeout-ms: 5000
  read-timeout-ms: 60000
  daily-limit: 50

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: info
    com.example.calorie: debug
